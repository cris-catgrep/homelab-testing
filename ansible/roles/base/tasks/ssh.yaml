# Configuracion de ssh
- name: "Actualizar paquetes"
  ansible.builtin.dnf:
    name: "*"
    state: latest
    update_cache: true

- name: "Asegurarse de que ssh esta instalado"
  ansible.builtin.dnf:
    name: openssh-server
    state: present

- name: "Configurar el archivo de configuracion ssh"
  ansible.builtin.template:
    src: templates/sshd_config.j2
    dest: /etc/ssh/sshd_config
    owner: root
    group: root
    mode: "0600"
    backup: true
    validate: "sshd -t -f %s"

- name: "Confirmar que el servicio de sshd  esta habilitado y corriendo"
  ansible.builtin.service:
    name: sshd
    state: started
    enabled: true

- name: "Comprobar que dnf-automatic esta instalado"
  ansible.builtin.dnf:
    name: dnf-automatic
    state: present

- name: "Activar timer dnf-automatic"
  ansible.builtin.copy:
    src: templates/dnf-automatic.timer.j2
    dest: "{{ base_dnf_automatic_timer_path }}"
    owner: "{{ base_root_user }}"
    group: "{{ base_root_user }}"
    mode: '0644'
    backup: true

- name: "Configurar dnf-automatic"
  ansible.builtin.copy:
    src: templates/automatic.conf.j2
    dest: "{{ base_dnf_automatic_config_path }}"
    owner: "{{ base_root_user }}"
    group: "{{ base_root_user }}"
    mode: '0644'
    backup: true

- name: "Activar timer dnf-automatic"
  ansible.builtin.systemd_service:
    name: dnf-automatic.timer
    state: started
    enabled: true

- name: "Activar dnf-automatic"
  ansible.builtin.service:
    name: dnf-automatic
    state: started
    enabled: true

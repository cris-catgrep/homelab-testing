- name: "Creacion de red gitea"
  become: false
  containers.podman.podman_network:
    state: quadlet
    name: "gitea-app"

- name: "Creacion de quadlet gitea"
  become: false
  containers.podman.podman_container:
    name: "gitea-app"
    image: "docker.gitea.com/gitea:latest"
    state: quadlet
    ports:
      - "3000:3000"
      - "2222:22"
    volume:
      - "/home/rei/cont/gitea:/data:Z,U"
    network: "gitea-app.network"
    env:
      USER_UID: "1000"
      USER_GID: "1000"

    quadlet_options:
      - "AutoUpdate=registry"
      - "Pull=newer"
      - |
        [Service]
        Restart=allways
      - |
       [Install]
       WantedBy=default.target
  notify: "Daemon-reload"

- name: "Iniciar quadlet gitea"
  become: false
  ansible.builtin.systemd_service:
    scope: user
    name: gitea-app
    state: started

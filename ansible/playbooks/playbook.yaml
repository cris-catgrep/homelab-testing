- name: "Configuracion de ssh"
  hosts: all
  become: true
  tasks:

    - name: "Actualizar paquetes"
      ansible.builtin.dnf:
        name: "*"
        state: latest
        # autoremove: true
        update_cache: true

    - name: "Asegurarse de que ssh esta instalado"
      ansible.builtin.dnf:
        name: openssh-server
        state: present


### No es necesario crear una copia con el modulo copy ya que la propiedad "backup" lo crea de forma automatica ###
#    - name : "Respaldar archivo de configuracion original"
#      ansible.builtin.copy:
#        src: /etc/ssh/sshd_config
#        dest: /etc/ssh/sshd_config.bk
#        remote_src: true
#        mode: "0600"
#        force: false

    - name: "Configurar el archivo de configuracion ssh"
      ansible.builtin.template:
        src: templates/sshd_config.j2
        dest: /etc/ssh/sshd_config
        owner: root
        group: root
        mode: "0600"
        backup: true
        validate: "sshd -t -f %s"

    - name: "Confirmar que el servicio de sshd  esta habilitado y corriendo"
      ansible.builtin.service:
        name: sshd
        state: started
        enabled: true

  handlers:
    - name: "Reiniciar sshd"
      ansible.builtin.service:
        name: sshd
        state: restarted
